name: Validate V2 Activities

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:contract
      - run: npm run check:catalog
      - name: Require semantic version bumps for package changes
        run: npm run check:versions
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
